[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccsweb"
dynamic = ["version"]
description = "Conversational Chat Storer - web backend. Unified viewer for AI coding-tool chat history."
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
]

[project.scripts]
ccsweb = "ccsweb.__main__:main"

[tool.hatch.version]
path = "../VERSION.txt"
pattern = "(?P<version>\\d+\\.\\d+\\.\\d+)"

[tool.hatch.build.targets.wheel]
packages = ["ccsweb"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
