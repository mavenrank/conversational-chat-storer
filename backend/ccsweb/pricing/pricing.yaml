# Model pricing, USD per 1,000,000 tokens.
#
# ---------------------------------------------------------------------------
# SOURCES  (fetched 2026-08-05; both pages state "Last updated: Aug 4, 2026")
#
#   opencode-go : https://opencode.ai/docs/go/    section "Usage limits"
#   opencode    : https://opencode.ai/docs/zen/   section "Pricing"
#   anthropic   : https://www.anthropic.com/pricing   (list API pricing)
#   google      : https://ai.google.dev/gemini-api/docs/pricing
#   openai      : https://openai.com/api/pricing/
#
# IMPORTANT — Go and Zen are NOT the same price list. Go is the $10/month
# subscription and is materially cheaper on several models; e.g. DeepSeek V4 Pro
# is $0.435 in on Go against $1.74 on Zen, and its cached read is $0.003625
# against $0.145 — a 40x difference. Always match on the provider recorded in
# the session (`providerID`), never on the model id alone.
#
# ---------------------------------------------------------------------------
# EDITING
#
# Add or correct a model under the right provider. Keys:
#   input         prompt tokens
#   output        generated tokens
#   cache_read    tokens served from cache (usually ~10% of input)
#   cache_write   tokens written to cache ("-" in the docs means not charged)
#   over          optional long-context tier: {threshold, input, output, ...}
#                 applied when a single request's input exceeds `threshold`
#
# A model listed with all-zero rates is genuinely free, not "unknown". Unknown
# models are reported separately by the stats endpoint so gaps stay visible
# rather than silently costing $0.
# ---------------------------------------------------------------------------

version: 1
currency: USD
unit: per_1m_tokens

providers:
  # =========================================================================
  # OpenCode Go — https://opencode.ai/docs/go/
  # $10/month subscription. These are the rates the usage allowance is
  # measured against, so they are the right basis for "what would this have
  # cost on the API".
  # =========================================================================
  opencode-go:
    display_name: OpenCode Go
    models:
      grok-4.5:          { input: 2.00,  output: 6.00,  cache_read: 0.30 }
      gpt-5.6-luna:
        input: 0.20
        output: 1.20
        cache_read: 0.02
        cache_write: 0.25
        over: { threshold: 272000, input: 0.40, output: 1.80, cache_read: 0.04, cache_write: 0.50 }
      glm-5.2:           { input: 1.40,  output: 4.40,  cache_read: 0.26 }
      glm-5.1:           { input: 1.40,  output: 4.40,  cache_read: 0.26 }
      kimi-k3:           { input: 3.00,  output: 15.00, cache_read: 0.30 }
      kimi-k2.7-code:    { input: 0.95,  output: 4.00,  cache_read: 0.19 }
      kimi-k2.6:         { input: 0.95,  output: 4.00,  cache_read: 0.16 }
      mimo-v2.5:         { input: 0.14,  output: 0.28,  cache_read: 0.0028 }
      mimo-v2.5-pro:     { input: 0.435, output: 0.87,  cache_read: 0.003625 }
      minimax-m3:        { input: 0.30,  output: 1.20,  cache_read: 0.06 }
      minimax-m2.7:      { input: 0.30,  output: 1.20,  cache_read: 0.06, cache_write: 0.375 }
      minimax-m2.5:      { input: 0.30,  output: 1.20,  cache_read: 0.06, cache_write: 0.375 }
      qwen3.8-max:       { input: 2.00,  output: 6.00,  cache_read: 0.25, cache_write: 2.50 }
      qwen3.7-max:       { input: 2.50,  output: 7.50,  cache_read: 0.50, cache_write: 3.125 }
      qwen3.7-plus:
        input: 0.40
        output: 1.60
        cache_read: 0.04
        cache_write: 0.50
        over: { threshold: 256000, input: 1.20, output: 4.80, cache_read: 0.12, cache_write: 1.50 }
      qwen3.6-plus:
        input: 0.50
        output: 3.00
        cache_read: 0.05
        cache_write: 0.625
        over: { threshold: 256000, input: 2.00, output: 6.00, cache_read: 0.20, cache_write: 2.50 }
      deepseek-v4-pro:   { input: 0.435, output: 0.87,  cache_read: 0.003625 }
      deepseek-v4-flash: { input: 0.14,  output: 0.28,  cache_read: 0.0028 }
      hy3:               { input: 0.14,  output: 0.58,  cache_read: 0.035 }

      # NOTE: the Go pricing table lists no free models. Do not add "-free"
      # entries here; the free tier belongs to Zen.

  # =========================================================================
  # OpenCode Zen — https://opencode.ai/docs/zen/
  # Pay-as-you-go. Only the models seen in real sessions plus the common ones.
  # =========================================================================
  opencode:
    display_name: OpenCode Zen
    models:
      claude-fable-5:    { input: 10.00, output: 50.00, cache_read: 1.00, cache_write: 12.50 }
      claude-opus-5:     { input: 5.00,  output: 25.00, cache_read: 0.50, cache_write: 6.25 }
      claude-opus-4.6:   { input: 5.00,  output: 25.00, cache_read: 0.50, cache_write: 6.25 }
      claude-opus-4.5:   { input: 5.00,  output: 25.00, cache_read: 0.50, cache_write: 6.25 }
      claude-sonnet-5:   { input: 2.00,  output: 10.00, cache_read: 0.20, cache_write: 2.50 }
      claude-sonnet-4.6: { input: 3.00,  output: 15.00, cache_read: 0.30, cache_write: 3.75 }
      claude-sonnet-4.5:
        input: 3.00
        output: 15.00
        cache_read: 0.30
        cache_write: 3.75
        over: { threshold: 200000, input: 6.00, output: 22.50, cache_read: 0.60, cache_write: 7.50 }
      claude-haiku-4.5:  { input: 1.00,  output: 5.00,  cache_read: 0.10, cache_write: 1.25 }
      gemini-3-flash:    { input: 0.50,  output: 3.00,  cache_read: 0.05 }
      gemini-3.5-flash:  { input: 1.50,  output: 9.00,  cache_read: 0.15 }
      gpt-5.6-luna:
        input: 0.20
        output: 1.20
        cache_read: 0.02
        cache_write: 0.25
        over: { threshold: 272000, input: 0.40, output: 1.80, cache_read: 0.04, cache_write: 0.50 }
      gpt-5.4-mini:      { input: 0.75,  output: 4.50,  cache_read: 0.075 }
      glm-5.2:           { input: 1.40,  output: 4.40,  cache_read: 0.26 }
      glm-5.1:           { input: 1.40,  output: 4.40,  cache_read: 0.26 }
      kimi-k2.5:         { input: 0.60,  output: 3.00,  cache_read: 0.10 }
      kimi-k3:           { input: 3.00,  output: 15.00, cache_read: 0.30 }
      minimax-m3:        { input: 0.30,  output: 1.20,  cache_read: 0.06 }
      qwen3.7-max:       { input: 2.50,  output: 7.50,  cache_read: 0.50, cache_write: 3.125 }
      qwen3.6-plus:      { input: 0.50,  output: 3.00,  cache_read: 0.05, cache_write: 0.625 }
      deepseek-v4-pro:   { input: 1.74,  output: 3.48,  cache_read: 0.145 }
      deepseek-v4-flash: { input: 0.14,  output: 0.28,  cache_read: 0.028 }
      # Free models, verbatim from the Zen "Pricing" table. The complete list
      # is: big-pickle, deepseek-v4-flash-free, mimo-v2.5-free,
      # laguna-s-2.1-free, ling-3.0-flash-free, north-mini-code-free,
      # nemotron-3-ultra-free. Only the two seen in real sessions are listed.
      #
      # All of them are flagged "limited time" — a model that is free today can
      # start costing money without notice, so treat a 0 here as a snapshot,
      # not a property of the model.
      mimo-v2.5-free:    { input: 0.0,   output: 0.0,   cache_read: 0.0 }
      deepseek-v4-flash-free: { input: 0.0, output: 0.0, cache_read: 0.0 }

      # NOT LISTED: minimax-m2.5-free. It appears in real sessions (258
      # messages) but is on no OpenCode page — not the model index, not the
      # pricing table, not the free-models list. A previous edit of this file
      # invented it at $0 by conflating it with the *paid* `minimax-m2.5`
      # ($0.30 / $1.20 / $0.06), which is deprecated 2026-08-05. That would
      # have recorded a paid model as free. It is deliberately absent so those
      # tokens are reported unpriced instead of silently costing nothing.
      minimax-m2.5:      { input: 0.30,  output: 1.20,  cache_read: 0.06, cache_write: 0.375 }

  # =========================================================================
  # GitHub Copilot — a flat subscription with no published per-token rate.
  # Priced here at the underlying vendor's list rate so "what this would have
  # cost on the API" stays answerable. Flagged `notional: true` so the UI can
  # say so rather than implying it was billed.
  # =========================================================================
  github-copilot:
    display_name: GitHub Copilot
    notional: true
    models:
      claude-sonnet-4.6: { input: 3.00,  output: 15.00, cache_read: 0.30, cache_write: 3.75 }
      claude-sonnet-4.5: { input: 3.00,  output: 15.00, cache_read: 0.30, cache_write: 3.75 }
      claude-haiku-4.5:  { input: 1.00,  output: 5.00,  cache_read: 0.10, cache_write: 1.25 }
      claude-opus-4.6:   { input: 5.00,  output: 25.00, cache_read: 0.50, cache_write: 6.25 }
      gpt-5.4-mini:      { input: 0.75,  output: 4.50,  cache_read: 0.075 }
      gemini-3-flash-preview: { input: 0.50, output: 3.00, cache_read: 0.05 }

  # =========================================================================
  # Anthropic direct — used by the Claude Code adapter, which records no
  # provider. Rates from anthropic.com/pricing.
  # =========================================================================
  anthropic:
    display_name: Anthropic
    models:
      claude-opus-5:     { input: 5.00,  output: 25.00, cache_read: 0.50, cache_write: 6.25 }
      claude-fable-5:    { input: 10.00, output: 50.00, cache_read: 1.00, cache_write: 12.50 }
      claude-sonnet-5:   { input: 2.00,  output: 10.00, cache_read: 0.20, cache_write: 2.50 }
      claude-haiku-4.5:  { input: 1.00,  output: 5.00,  cache_read: 0.10, cache_write: 1.25 }

  # =========================================================================
  # Google — Gemini CLI. The free tier covers most personal use, so these are
  # notional list rates.
  # =========================================================================
  google:
    display_name: Google
    notional: true
    models:
      gemini-3-flash-preview: { input: 0.50, output: 3.00, cache_read: 0.05 }
      gemini-3-flash:         { input: 0.50, output: 3.00, cache_read: 0.05 }
      gemini-3.5-flash:       { input: 1.50, output: 9.00, cache_read: 0.15 }

# Aliases: model ids that differ between the store and the price table.
# Left side is what a session records, right side is the key to price with.
aliases:
  claude-sonnet-4-6: claude-sonnet-4.6
  claude-sonnet-4-5: claude-sonnet-4.5
  claude-haiku-4-5: claude-haiku-4.5
  claude-opus-4-6: claude-opus-4.6
  claude-opus-4-5: claude-opus-4.5
  claude-opus-4-8: claude-opus-4.8
  gpt-5.6-luna-high: gpt-5.6-luna
  mai-code-1-flash-picker: mimo-v2.5
