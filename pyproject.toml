[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ccs"
dynamic = ["version"]
description = "Conversational Chat Storer - Unified viewer for CLI chat sessions from AI coding tools"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "textual>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
ccs = "ccs.cli:main"

[tool.hatch.version]
path = "VERSION.txt"
pattern = "(?P<version>\\d+\\.\\d+\\.\\d+)"

[tool.hatch.build.targets.wheel]
packages = ["ccs"]
